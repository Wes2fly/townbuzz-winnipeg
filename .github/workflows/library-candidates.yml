name: Discover Library Event Candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Collect library candidates
        env:
          WPL_ICAL_URL: ${{ secrets.WPL_ICAL_URL }}
        run: python scripts/fetch_library_candidates.py

      - name: Save reviewed candidate queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update library event candidates"
            git push
          fi
